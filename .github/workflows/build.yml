name: Check and build Godot
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/airvel-toolchain
            ~/.local/share/godot/export_templates/4.6.3.stable
          key: godot-4.6.3-linux-macos-v1
      - name: Install verified Godot and export templates
        run: bash tools/bootstrap.sh
      - name: Import resources
        run: bash tools/import.sh
      - name: Run regression and gameplay tests
        run: bash tools/test.sh
      - name: Export universal macOS development build
        run: |
          mkdir -p build
          godot --headless --export-debug macOS build/Airvel-macOS.zip
          python3 tools/verify_macos.py build/Airvel-macOS.zip
          python3 tools/verify_pack.py build/Airvel-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Airvel-macOS-development
          path: build/Airvel-macOS.zip
          if-no-files-found: error
          retention-days: 14
